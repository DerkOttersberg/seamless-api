plugins { id 'dev.architectury.loom' }
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
dependencies { minecraft libs.minecraft; mappings loom.officialMojangMappings(); neoForge libs.neoforge }
loom { mods { seamlessapi { sourceSet sourceSets.main } } }
def metadataProperties=[mod_version:project.version.toString(),neo_version_range:'[21.1.255,21.2)',minecraft_version_range:'[1.21.1]']
processResources { inputs.properties metadataProperties; filesMatching('META-INF/neoforge.mods.toml') { expand metadataProperties } }
tasks.named('jar',Jar) { duplicatesStrategy=DuplicatesStrategy.EXCLUDE; archiveFileName="seamless-api-${project.version}-neoforge-dev.jar" }
tasks.named('remapJar') { archiveFileName="seamless-api-${project.version}-neoforge.jar" }
tasks.named('sourcesJar',Jar) { from project(':common').sourceSets.main.allSource; duplicatesStrategy=DuplicatesStrategy.EXCLUDE }
tasks.named('remapSourcesJar') { archiveFileName="seamless-api-${project.version}-neoforge-sources.jar" }
