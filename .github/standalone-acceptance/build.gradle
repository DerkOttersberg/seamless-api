plugins { id 'dev.architectury.loom-no-remap' version '1.17.493' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
}
def loader = providers.gradleProperty('clientLoader').orElse('fabric').get()
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
sourceSets.main {
    java.srcDirs = ['src/common/java', 'src/' + loader + '/java']
    resources.srcDirs = ['src/common/resources', 'src/' + loader + '/resources']
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    if (loader == 'fabric') implementation 'net.fabricmc:fabric-loader:0.19.5'
    else if (loader == 'forge') forge 'net.minecraftforge:forge:26.3-66.0.9'
    else neoForge 'net.neoforged:neoforge:26.3.0.48-beta'
}
tasks.named('jar', Jar) {
    archiveFileName = 'qa-standalone-acceptance-' + loader + '.jar'
    if (loader != 'fabric') manifest.attributes('MixinConfigs': 'qa-standalone.mixins.json')
}
