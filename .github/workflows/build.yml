name: build

on:
  push:
    branches: [main, 'port/**', 'support/**', 'feat/**', 'fix/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  loader-builds:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :common:check :${{ matrix.loader }}:check :${{ matrix.loader }}:build
      - name: Upload ${{ matrix.loader }} reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seamless-api-${{ matrix.loader }}-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/test-results/**

  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean check build
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seamless-api-verification-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/test-results/**
