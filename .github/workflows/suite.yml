name: locked-suite

on:
  workflow_dispatch:
  push:
    branches: ['1.20.1']
    paths:
      - suite-lock.json
      - .github/workflows/suite.yml
      - .github/scripts/**
      - .github/fixtures/**
      - .github/legacy-client-qa/**
  pull_request:

permissions:
  contents: read

jobs:
  locked-builds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate the suite lock and RCON harness
        run: |
          python3 -B .github/scripts/tests/test_verify_suite_lock.py
          python3 -B .github/scripts/tests/test_rcon_command.py
          python3 -B .github/scripts/verify_suite_lock.py suite-lock.json
      - name: Check out exact compatible source
        shell: bash
        run: |
          set -euo pipefail
          mkdir suite
          while IFS=$'\t' read -r directory repository commit; do
            git -c init.defaultBranch=1.20.1 init "suite/$directory"
            git -C "suite/$directory" remote add origin "https://github.com/$repository.git"
            git -C "suite/$directory" fetch --depth=1 origin "$commit"
            git -C "suite/$directory" checkout --detach FETCH_HEAD
            test "$(git -C "suite/$directory" rev-parse HEAD)" = "$commit"
          done < <(jq -r '.repositories[] | [.directory, .repository, .commit] | @tsv' suite-lock.json)
      - name: Build/test all five repositories and collect ten runtime jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-jars/{fabric,forge}
          while IFS=$'\t' read -r directory base version; do
            (cd "suite/$directory" && ./gradlew --no-daemon clean check build)
            for loader in fabric forge; do
              cp "suite/$directory/$loader/build/libs/$base-$version-$loader.jar" "runtime-jars/$loader/"
            done
          done < <(jq -r '.repositories | sort_by(.releaseOrder)[] | [.directory, .artifactBase, .artifactVersion] | @tsv' suite-lock.json)
          test "$(find runtime-jars -type f -name '*.jar' | wc -l)" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-runtime-jars
          if-no-files-found: error
          path: runtime-jars
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-suite-reports
          if-no-files-found: ignore
          path: |
            suite/**/build/reports/**
            suite/**/build/test-results/**
            suite/**/logs/**
            suite/**/crash-reports/**

  packaged-suite:
    needs: locked-builds
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: minecraft-1.20.1-runtime-jars
          path: runtime-jars
      - name: Boot untouched production jars and verify persistence across restart
        run: |
          timeout --kill-after=20s 900s nice -n 10 taskset -c 0,1 bash .github/scripts/run-packaged-suite.sh \
            "${{ matrix.loader }}" "$PWD/runtime-jars/${{ matrix.loader }}" "$PWD/packaged-run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-suite-${{ matrix.loader }}-evidence
          if-no-files-found: ignore
          path: |
            packaged-run/qa-logs/**
            packaged-run/logs/**
            packaged-run/crash-reports/**
            packaged-run/config/**
            packaged-run/suite-world/**
            packaged-run/*installer*.log

  isolated-client:
    needs: [locked-builds, packaged-suite]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install --yes xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64
      - uses: actions/download-artifact@v4
        with:
          name: minecraft-1.20.1-runtime-jars
          path: runtime-jars
      - uses: actions/download-artifact@v4
        with:
          name: packaged-suite-${{ matrix.loader }}-evidence
          path: server-evidence
      - name: Test all five mods and JEI in private Xvfb
        run: |
          bash .github/scripts/run-isolated-suite-client.sh "${{ matrix.loader }}" \
            "$PWD/runtime-jars/${{ matrix.loader }}" "$PWD/server-evidence/suite-world" "$PWD/client-profile"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-client-${{ matrix.loader }}-evidence
          if-no-files-found: ignore
          path: |
            client-profile/logs/**
            client-profile/screenshots/**
            client-profile/client-qa-*.txt
            client-profile/crash-reports/**

  release-gate:
    if: always()
    needs: [locked-builds, packaged-suite, isolated-client]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every configured lane
        env:
          BUILDS: ${{ needs.locked-builds.result }}
          SERVERS: ${{ needs.packaged-suite.result }}
          CLIENTS: ${{ needs.isolated-client.result }}
        run: |
          test "$BUILDS" = success
          test "$SERVERS" = success
          test "$CLIENTS" = success
