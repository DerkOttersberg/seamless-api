name: locked-suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - suite-lock.json
      - .github/workflows/suite.yml
  pull_request:
    paths:
      - suite-lock.json
      - .github/workflows/suite.yml

permissions:
  contents: read

jobs:
  locked-builds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out locked commits
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1 and (.repositories | length == 5)' suite-lock.json >/dev/null
          mkdir suite
          while IFS=$'\t' read -r directory repository commit; do
            git -c init.defaultBranch=main init "suite/$directory"
            git -C "suite/$directory" remote add origin "https://github.com/$repository.git"
            git -C "suite/$directory" fetch --depth=1 origin "$commit"
            git -C "suite/$directory" checkout --detach FETCH_HEAD
            test "$(git -C "suite/$directory" rev-parse HEAD)" = "$commit"
          done < <(jq -r '.repositories[] | [.directory, .repository, .commit] | @tsv' suite-lock.json)
      - name: Build and test every locked repository
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r directory; do
            (cd "suite/$directory" && ./gradlew clean check build)
          done < <(jq -r '.repositories | sort_by(.releaseOrder)[] | .directory' suite-lock.json)

  combined-fabric-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out locked commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir suite
          while IFS=$'\t' read -r directory repository commit; do
            git -c init.defaultBranch=main init "suite/$directory"
            git -C "suite/$directory" remote add origin "https://github.com/$repository.git"
            git -C "suite/$directory" fetch --depth=1 origin "$commit"
            git -C "suite/$directory" checkout --detach FETCH_HEAD
            test "$(git -C "suite/$directory" rev-parse HEAD)" = "$commit"
          done < <(jq -r '.repositories[] | [.directory, .repository, .commit] | @tsv' suite-lock.json)
      - name: Build combined Fabric profile
        shell: bash
        run: |
          set -euo pipefail
          (cd suite/Seamless-API && ./gradlew :fabric:build)
          (cd suite/pretty-meteors-with-trails && ./gradlew :fabric:build)
          (cd suite/seamless-deconstructing-workbench && ./gradlew :fabric:build)
          (cd suite/Seamless-Crafting && ./gradlew :fabric:build)
          (cd suite/Seamless-block-animations && xvfb-run -a ./gradlew :fabric:runClientGameTest -PsuiteTest=true -PgraphicsBackend=opengl)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locked-suite-fabric-opengl-screenshots
          path: suite/Seamless-block-animations/fabric/build/run/clientGameTest/screenshots
