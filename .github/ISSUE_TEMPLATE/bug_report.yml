name: Bug report
description: Report a reproducible API or loader-integration problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options: [Fabric, Forge, NeoForge]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, API, and loader versions
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: Affected API class or contract
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      render: shell
