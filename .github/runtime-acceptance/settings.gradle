pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
}
def loader = providers.gradleProperty('clientLoader').orElse('fabric').get()
if (!(loader in ['fabric', 'forge', 'neoforge'])) throw new GradleException('Invalid loader: ' + loader)
gradle.beforeProject { project -> project.ext.set('loom.platform', loader) }
rootProject.name = 'suite-runtime-acceptance'
