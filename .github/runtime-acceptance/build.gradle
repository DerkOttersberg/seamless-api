plugins { id 'dev.architectury.loom-no-remap' version '1.17.491' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
}
def loader = providers.gradleProperty('clientLoader').orElse('fabric').get()
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
sourceSets.main {
    java.srcDirs = ['src/common/java', 'src/' + loader + '/java']
    resources.srcDirs = ['src/common/resources', 'src/' + loader + '/resources']
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    if (loader == 'fabric') {
        implementation 'net.fabricmc:fabric-loader:0.19.3'
        implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'
    } else if (loader == 'forge') forge 'net.minecraftforge:forge:26.2-65.1.3'
    else neoForge 'net.neoforged:neoforge:26.2.0.75'
    compileOnly fileTree(providers.gradleProperty('runtimeJarsDir').orElse('../../../qa-artifacts/final-runtime-jars-v7/' + loader).get()) { include '*.jar' }
}
tasks.named('jar', Jar) {
    archiveFileName = 'qa-runtime-acceptance-' + loader + '.jar'
    if (loader != 'fabric') manifest.attributes('MixinConfigs': 'qa-runtime.mixins.json')
}
