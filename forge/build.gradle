plugins {
    id 'dev.architectury.loom-no-remap'
}

base {
    archivesName = rootProject.archives_base_name
}

// Forge 26.2 transforms one named module. Fold common sources into that
// module so the public API and loader entrypoint share the same classloader.
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

// Loom 1.17's legacy Forge mapping services are incompatible with the
// unobfuscated 26.2 release and incorrectly require a mappings file.
configurations.forgeRuntimeLibrary {
    exclude group: 'dev.architectury', module: 'architectury-naming-service'
    exclude group: 'dev.architectury', module: 'architectury-mixin-remapper-service'
}

dependencies {
    minecraft libs.minecraft
    forge libs.forge
}

loom {
    mods {
        seamlessapi {
            sourceSet sourceSets.main
        }
    }
}

def metadataProperties = [
    mod_version: project.version,
    loader_version_range: '[65,)',
    forge_version_range: '[65.1.3,66)',
    minecraft_version_range: '[26.2,26.3)'
]

processResources {
    inputs.properties metadataProperties
    filesMatching('META-INF/mods.toml') {
        expand metadataProperties
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest { attributes 'Automatic-Module-Name': 'com.derko.seamlessapi' }
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge.jar"
}

tasks.named('sourcesJar', Jar) {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "${rootProject.archives_base_name}-${project.version}-forge-sources.jar"
}
