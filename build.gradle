plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}

architectury {
    minecraft = libs.versions.minecraft.get()
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.architectury.dev/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = libs.versions.java.get().toInteger()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
                artifactId = "${rootProject.archives_base_name}-${project.name}"
            }
        }
        repositories {
            mavenLocal()
        }
    }
}

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    description = 'Fails when loader-specific imports leak into common sources.'
    inputs.files(fileTree('common/src') { include '**/*.java' })

    doLast {
        def forbidden = ['net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.']
        def violations = []
        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) {
                    violations << "${source}:${number}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Loader imports found in common:\n${violations.join('\n')}")
        }
    }
}

tasks.register('verifyLoaderJars') {
    group = 'verification'
    description = 'Checks that each distributable jar contains only its own loader metadata.'
    dependsOn ':fabric:jar', ':forge:jar', ':neoforge:jar'

    doLast {
        def specifications = [
            fabric: [
                expected: 'fabric.mod.json',
                forbidden: ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']
            ],
            forge: [
                expected: 'META-INF/mods.toml',
                forbidden: ['fabric.mod.json', 'META-INF/neoforge.mods.toml']
            ],
            neoforge: [
                expected: 'META-INF/neoforge.mods.toml',
                forbidden: ['fabric.mod.json', 'META-INF/mods.toml']
            ]
        ]

        specifications.each { loader, specification ->
            def archive = project(":${loader}").tasks.named('jar', Jar).get().archiveFile.get().asFile
            def expectedName = "${rootProject.archives_base_name}-${project.version}-${loader}.jar"
            if (archive.name != expectedName) {
                throw new GradleException("Expected ${expectedName}, found ${archive.name}")
            }
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                if (zip.getEntry(specification.expected) == null) {
                    throw new GradleException("${archive.name} is missing ${specification.expected}")
                }
                specification.forbidden.each { entry ->
                    if (zip.getEntry(entry) != null) {
                        throw new GradleException("${archive.name} contains stale metadata ${entry}")
                    }
                }
                if (zip.getEntry('io/github/derkottersberg/seamlessapi/internal/SeamlessApiBootstrap.class') == null) {
                    throw new GradleException("${archive.name} does not contain the common API implementation")
                }

                if (loader == 'fabric') {
                    def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
                    if (metadata.schemaVersion != 1 || metadata.id != 'seamlessapi') {
                        throw new GradleException("${archive.name} contains unexpected Fabric identity/schema metadata")
                    }
                    if (metadata.version != project.version.toString()) {
                        throw new GradleException("${archive.name} declares unexpected version ${metadata.version}")
                    }
                    if (metadata.license != 'MIT' || metadata.depends.fabricloader != '>=0.19.3') {
                        throw new GradleException("${archive.name} contains unexpected license/loader metadata")
                    }
                    if (metadata.depends['fabric-api'] != null) {
                        throw new GradleException("${archive.name} must not require unused Fabric API")
                    }
                    if (metadata.depends.values().any { it == '*' }) {
                        throw new GradleException("${archive.name} contains a wildcard dependency")
                    }
                    if (metadata.depends.minecraft != '~26.2' || metadata.depends.java != '>=25') {
                        throw new GradleException("${archive.name} contains unexpected Minecraft/Java dependency ranges")
                    }
                } else {
                    def metadata = zip.getInputStream(zip.getEntry(specification.expected)).getText('UTF-8')
                    if (metadata.contains('${')) {
                        throw new GradleException("${archive.name} contains unprocessed metadata placeholders")
                    }
                    def requiredValues = loader == 'forge'
                            ? ['modLoader="javafml"', 'loaderVersion="[65,)"', 'license="MIT"',
                               "version=\"${project.version}\"", 'modId="forge"', 'versionRange="[65.1.3,66)"',
                               'modId="minecraft"', 'versionRange="[26.2,26.3)"', 'javaVersion="[25,)"']
                            : ['license="MIT"', "version=\"${project.version}\"", 'modId="neoforge"',
                               'versionRange="[26.2.0.75,26.3)"', 'modId="minecraft"',
                               'versionRange="[26.2,26.3)"', 'javaVersion="[25,)"']
                    requiredValues.each { value ->
                        if (!metadata.contains(value)) {
                            throw new GradleException("${archive.name} is missing processed metadata: ${value}")
                        }
                    }
                }
            }
        }
    }
}

def suiteLockPython = providers.gradleProperty('pythonExecutable').orElse(
        providers.provider { System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3' }
)

tasks.register('testSuiteLockVerifier', Exec) {
    group = 'verification'
    description = 'Runs valid and invalid manifest fixtures against the suite-lock verifier.'
    workingDir rootProject.projectDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine suiteLockPython.get(),
            '-B',
            '.github/scripts/tests/test_verify_suite_lock.py'
}

tasks.register('testRconHelper', Exec) {
    group = 'verification'
    description = 'Runs protocol-level tests for the packaged-suite RCON client.'
    workingDir rootProject.projectDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine suiteLockPython.get(),
            '-B',
            '.github/scripts/tests/test_rcon_command.py'
}

tasks.register('verifySuiteLock', Exec) {
    group = 'verification'
    description = 'Validates suite-lock.json before the locked release suite is built.'
    dependsOn tasks.named('testSuiteLockVerifier')
    workingDir rootProject.projectDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine suiteLockPython.get(),
            '-B',
            '.github/scripts/verify_suite_lock.py',
            'suite-lock.json'
}

tasks.named('assemble') {
    dependsOn subprojects.collect { it.tasks.named('assemble') }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCommonIsolation')
    dependsOn tasks.named('verifyLoaderJars')
    dependsOn tasks.named('testRconHelper')
    dependsOn subprojects.collect { it.tasks.named('check') }
}
