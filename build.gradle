plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}

architectury {
    minecraft = libs.versions.minecraft.get()
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.architectury.dev/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = libs.versions.java.get().toInteger()
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(Jar).configureEach {
        from rootProject.file('LICENSE')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
                artifactId = "${rootProject.archives_base_name}-${project.name}"
            }
        }
        repositories {
            mavenLocal()
        }
    }
}

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    description = 'Fails when loader-specific imports leak into common sources.'
    inputs.files(fileTree('common/src') { include '**/*.java' })

    doLast {
        def forbidden = ['net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.']
        def violations = []
        inputs.files.files.sort().each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) {
                    violations << "${source}:${number}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Loader imports found in common:\n${violations.join('\n')}")
        }
    }
}

tasks.register('verifyLoaderJars') {
    dependsOn ':fabric:remapJar',':forge:remapJar',':neoforge:remapJar'
    doLast {
        def paths=[fabric:'fabric.mod.json',forge:'META-INF/mods.toml',neoforge:'META-INF/neoforge.mods.toml']
        paths.each { loader,metadataPath ->
            def archive=project(":${loader}").tasks.named('remapJar').get().archiveFile.get().asFile
            assert archive.name=="seamless-api-${project.version}-${loader}.jar"
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                assert zip.getEntry(metadataPath)!=null
                paths.values().findAll { it!=metadataPath }.each { assert zip.getEntry(it)==null }
                ['LICENSE','assets/seamlessapi/icon.png','io/github/derkottersberg/seamlessapi/internal/SeamlessApiBootstrap.class'].each { assert zip.getEntry(it)!=null }
                zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                    new DataInputStream(zip.getInputStream(entry)).withCloseable { header ->
                        assert header.readInt()==-889275714; header.readUnsignedShort(); assert header.readUnsignedShort()==65
                    }
                }
                def text=zip.getInputStream(zip.getEntry(metadataPath)).getText('UTF-8')
                assert !text.contains('${')
                if(loader=='fabric') {
                    def meta=new groovy.json.JsonSlurper().parseText(text)
                    assert meta.id=='seamlessapi' && meta.license=='MIT' && meta.version==project.version.toString()
                    assert meta.depends.minecraft=='1.21.1' && meta.depends.java=='>=21' && meta.depends.fabricloader=='>=0.19.5'
                    assert !meta.depends.containsKey('fabric-api')
                } else {
                    assert text.contains('license="MIT"') && text.contains('modId="seamlessapi"') && text.contains('versionRange="[1.21.1]"')
                    assert text.contains('javaVersion="[21,)"') && text.contains("version=\"${project.version}\"")
                    assert text.contains(loader=='forge' ? 'versionRange="[52.1.16,53)"' : 'versionRange="[21.1.255,21.2)"')
                }
            }
        }
    }
}

def suiteLockPython = providers.gradleProperty('pythonExecutable').orElse(
        providers.provider { System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3' }
)

tasks.register('testSuiteLockVerifier', Exec) {
    group = 'verification'
    description = 'Runs valid and invalid manifest fixtures against the suite-lock verifier.'
    workingDir rootProject.projectDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine suiteLockPython.get(),
            '-B',
            '.github/scripts/tests/test_verify_suite_lock.py'
}

tasks.register('testRconHelper', Exec) {
    group = 'verification'
    description = 'Runs protocol-level tests for the packaged-suite RCON client.'
    workingDir rootProject.projectDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine suiteLockPython.get(),
            '-B',
            '.github/scripts/tests/test_rcon_command.py'
}

tasks.register('verifySuiteLock', Exec) {
    group = 'verification'
    description = 'Validates suite-lock.json before the locked release suite is built.'
    dependsOn tasks.named('testSuiteLockVerifier')
    workingDir rootProject.projectDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine suiteLockPython.get(),
            '-B',
            '.github/scripts/verify_suite_lock.py',
            'suite-lock.json'
}

tasks.named('assemble') {
    dependsOn subprojects.collect { it.tasks.named('assemble') }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCommonIsolation')
    dependsOn tasks.named('verifyLoaderJars')
    dependsOn tasks.named('testRconHelper')
    dependsOn subprojects.collect { it.tasks.named('check') }
}
